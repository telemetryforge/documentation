name: Run scheduled CVE scans
on:
  schedule:
    - cron: "0 6 * * 3" # Every Wednesday at 6:00 AM UTC
  workflow_dispatch:
    # Allows manual triggering of the workflow
    inputs:
      dry-run:
        description: "Run the workflow in dry-run mode"
        required: false
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  run-cves-scan:
    name: Run CVE scan
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: "projects/841522437311/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "terraform-infra@infrastructure-464010.iam.gserviceaccount.com"

      - id: get-secrets
        name: Get secrets from GCP Secret Manager
        # This step retrieves secrets from GCP Secret Manager and sets them as outputs
        # The secrets can then be accessed in subsequent steps using ${{ steps.get-secrets.outputs.<secret_name> }}
        uses: "google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262" # v3.0.0
        with:
          secrets: |-
            github-pat:projects/626836145334/secrets/GITHUB_CI_PAT

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get-secrets.outputs.github-pat }}

      - name: Log into ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ steps.get-secrets.outputs.github-pat }}

      - name: Install Syft and Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        shell: bash

      - name: Ensure we authenticate the GH CLI
        run: |
          gh auth status || echo "Not authenticated"
        shell: bash
        env:
          GH_TOKEN: ${{ steps.get-secrets.outputs.github-pat }}

      - name: Run CVE scan
        run: ./scripts/security/run-scans.sh
        shell: bash
        env:
          GH_TOKEN: ${{ steps.get-secrets.outputs.github-pat }}

      - name: Debug output
        run: |
          echo "Checking for changes to commit..."
          git status
          echo "Changed files:"
          git diff --name-only
          echo "Change summary:"
          git diff --stat
        shell: bash

      - name: Commit and push updates to main
        if: ${{ !inputs.dry-run }}
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --signoff \
            -m "ci: update cve scan results" \
            -m "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin HEAD:main
        shell: bash
